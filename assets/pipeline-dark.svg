<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 552" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- chart (wayfinder), optional pre-stage -->
  <rect x="72" y="20" width="240" height="48" rx="10" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="192" y="40" text-anchor="middle" font-size="14" font-weight="600" fill="#8b949e">chart · wayfinder map</text>
  <text x="192" y="57" text-anchor="middle" font-size="11" fill="#8b949e">optional · one run per deliverable</text>
  <line x1="192" y1="68" x2="192" y2="94" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah)"/>

  <!-- band 1: human-in-the-loop -->
  <rect x="72" y="100" width="836" height="110" rx="14" fill="#2563eb" fill-opacity="0.10"/>
  <text x="88" y="122" font-size="11" font-weight="700" letter-spacing="1" fill="#93c5fd">HUMAN-IN-THE-LOOP<tspan font-weight="400" letter-spacing="0" fill="#8b949e">  ·  decisions are made here</tspan></text>

  <rect x="96" y="136" width="104" height="48" rx="10" fill="#2563eb"/>
  <text x="148" y="156" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">idea</text>
  <text x="148" y="172" text-anchor="middle" font-size="11" fill="#ffffff" fill-opacity="0.85">grill</text>

  <rect x="228" y="136" width="112" height="48" rx="10" fill="#2563eb" fill-opacity="0.14" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="284" y="156" text-anchor="middle" font-size="14" font-weight="600" fill="#93c5fd">research</text>
  <text x="284" y="172" text-anchor="middle" font-size="11" fill="#93c5fd" fill-opacity="0.8">optional</text>

  <rect x="368" y="136" width="116" height="48" rx="10" fill="#2563eb" fill-opacity="0.14" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="426" y="156" text-anchor="middle" font-size="14" font-weight="600" fill="#93c5fd">prototype</text>
  <text x="426" y="172" text-anchor="middle" font-size="11" fill="#93c5fd" fill-opacity="0.8">optional</text>

  <rect x="512" y="136" width="104" height="48" rx="10" fill="#2563eb"/>
  <text x="564" y="156" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">spec</text>
  <text x="564" y="172" text-anchor="middle" font-size="11" fill="#ffffff" fill-opacity="0.85">confirm seams</text>

  <rect x="644" y="136" width="104" height="48" rx="10" fill="#2563eb"/>
  <text x="696" y="156" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">plan</text>
  <text x="696" y="172" text-anchor="middle" font-size="11" fill="#ffffff" fill-opacity="0.85">tracer bullets</text>

  <rect x="776" y="136" width="104" height="48" rx="10" fill="#2563eb" fill-opacity="0.14" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="828" y="156" text-anchor="middle" font-size="14" font-weight="600" fill="#93c5fd">ticket</text>
  <text x="828" y="172" text-anchor="middle" font-size="11" fill="#93c5fd" fill-opacity="0.8">optional</text>

  <line x1="203" y1="160" x2="223" y2="160" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="343" y1="160" x2="363" y2="160" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="487" y1="160" x2="507" y2="160" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="619" y1="160" x2="639" y2="160" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="751" y1="160" x2="771" y2="160" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- band 1 -> band 2 -->
  <line x1="490" y1="212" x2="490" y2="244" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- band 2: autonomous -->
  <rect x="72" y="250" width="836" height="130" rx="14" fill="#b45309" fill-opacity="0.10"/>
  <text x="88" y="272" font-size="11" font-weight="700" letter-spacing="1" fill="#fcd34d">AUTONOMOUS (AFK)<tspan font-weight="400" letter-spacing="0" fill="#8b949e">  ·  runs end to end while you're away</tspan></text>

  <rect x="220" y="280" width="150" height="48" rx="10" fill="#b45309"/>
  <text x="295" y="300" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">implement</text>
  <text x="295" y="316" text-anchor="middle" font-size="11" fill="#ffffff" fill-opacity="0.85">frontier subagents</text>

  <rect x="430" y="280" width="150" height="48" rx="10" fill="#b45309"/>
  <text x="505" y="300" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">review</text>
  <text x="505" y="316" text-anchor="middle" font-size="11" fill="#ffffff" fill-opacity="0.85">cross-model</text>

  <rect x="640" y="280" width="150" height="48" rx="10" fill="#b45309" fill-opacity="0.14" stroke="#fcd34d" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="715" y="300" text-anchor="middle" font-size="14" font-weight="600" fill="#fcd34d">qa local</text>
  <text x="715" y="316" text-anchor="middle" font-size="11" fill="#fcd34d" fill-opacity="0.8">optional</text>

  <line x1="374" y1="304" x2="424" y2="304" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="584" y1="304" x2="634" y2="304" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- findings loop inside band 2 -->
  <path d="M715 328 L715 350 L295 350 L295 334" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text x="505" y="366" text-anchor="middle" font-size="11" fill="#8b949e">review &amp; QA findings re-enter implement as targeted fixes</text>

  <!-- band 2 -> band 3 -->
  <line x1="490" y1="382" x2="490" y2="414" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- band 3: ship -->
  <rect x="72" y="420" width="836" height="112" rx="14" fill="#047857" fill-opacity="0.10"/>
  <text x="88" y="442" font-size="11" font-weight="700" letter-spacing="1" fill="#6ee7b7">SHIP<tspan font-weight="400" letter-spacing="0" fill="#8b949e">  ·  human checkpoints</tspan></text>

  <rect x="220" y="452" width="150" height="48" rx="10" fill="#047857"/>
  <text x="295" y="472" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">push</text>
  <text x="295" y="488" text-anchor="middle" font-size="11" fill="#ffffff" fill-opacity="0.85">branches + PRs</text>

  <rect x="430" y="452" width="150" height="48" rx="10" fill="#047857" fill-opacity="0.14" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="505" y="472" text-anchor="middle" font-size="14" font-weight="600" fill="#6ee7b7">qa env</text>
  <text x="505" y="488" text-anchor="middle" font-size="11" fill="#6ee7b7" fill-opacity="0.8">deployed · optional</text>

  <rect x="640" y="452" width="150" height="48" rx="10" fill="#047857"/>
  <text x="715" y="472" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">complete</text>
  <text x="715" y="488" text-anchor="middle" font-size="11" fill="#ffffff" fill-opacity="0.85">verify + clean up</text>

  <line x1="374" y1="476" x2="424" y2="476" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="584" y1="476" x2="634" y2="476" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- env QA findings loop back to implement -->
  <path d="M505 500 L505 516 L48 516 L48 304 L214 304" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah)"/>
</svg>
